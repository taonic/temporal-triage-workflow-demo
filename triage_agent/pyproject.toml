[project]
name = "triage_agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.5.0",
    "pydantic-ai[temporal]>=1.18.0",
    "pydantic>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]
